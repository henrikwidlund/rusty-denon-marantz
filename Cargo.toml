[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/henrikwidlund/rusty-denon-marantz"

[workspace.dependencies]
denon-marantz-proto = { path = "crates/denon-marantz-proto", version = "0.1.0" }
denon-marantz-discovery = { path = "crates/denon-marantz-discovery", version = "0.1.0" }
denon-marantz-heos-proto = { path = "crates/denon-marantz-heos-proto", version = "0.1.0" }
denon-marantz-heos = { path = "crates/denon-marantz-heos", version = "0.1.0" }
thiserror = "2"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
proptest = "1"
socket2 = { version = "0.6", features = ["all"] }
allocation-counter = "0.8"
criterion = { version = "0.8", default-features = false }
bytes = "1"
http = "1"
if-addrs = "0.15"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1.44", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
# Conflicts with the `unreachable_pub` lint.
redundant_pub_crate = "allow"
# Duplicates come from dependencies.
multiple_crate_versions = "allow"
# Reports guards that are already dropped at the end of their block.
significant_drop_tightening = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1

# Size-optimized profile for small targets: `cargo build --profile embedded`.
[profile.embedded]
inherits = "release"
opt-level = "s"
strip = true
