[package]
name = "denon-marantz"
description = "Async client to monitor and control Denon and Marantz AV receivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["telnet", "http", "discovery"]
# Live events and commands on telnet port 23. Needs `http` to identify the receiver.
telnet = ["http", "tokio/io-util", "tokio/macros", "tokio/rt"]
# AppCommand XML over HTTP.
http = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util"]
# Find receivers with SSDP and mDNS.
discovery = ["dep:denon-marantz-discovery"]
# Full message dumps in trace logs. Can contain personal data.
sensitive-logs = []

[dependencies]
bytes = { workspace = true, optional = true }
denon-marantz-proto.workspace = true
denon-marantz-discovery = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "signal", "test-util"] }

[[example]]
name = "status"
required-features = ["http"]

[[example]]
name = "remote"
required-features = ["telnet"]

[[example]]
name = "watch"
required-features = ["telnet"]

[lints]
workspace = true
