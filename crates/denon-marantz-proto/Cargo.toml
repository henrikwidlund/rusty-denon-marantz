[package]
name = "denon-marantz-proto"
description = "Sans-IO protocol for Denon and Marantz AV receivers: telnet, AppCommand XML, the web interface and state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["denon", "marantz", "avr", "telnet", "protocol"]
categories = ["network-programming", "parser-implementations"]
# The test data are captured pages of receivers and are large.
exclude = ["/tests", "/benches"]

[features]
# Serialize and Deserialize for the types that `denon-marantz` stores in `Info`.
serde = ["dep:serde"]

[dependencies]
quick-xml.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "telnet"
harness = false

[[bench]]
name = "xml"
harness = false

[lints]
workspace = true
